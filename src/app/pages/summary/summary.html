<div class="app-layout">
    <app-navbar></app-navbar>
    <div class="page-content">
        <app-header></app-header>
        <main class="summary-main">
            <header class="summary-header">
                <h1>Join 360</h1>
                <div class="blue-line"></div>
                <h2>Key Metrics at a Glance</h2>
            </header>
            <section class="dashboard-wrapper">
                <section class="summary-dashboard">
                    <div class="part-1">
                        <article class="card-wrapper">
                            <img class="img-normal" src="app-icons/summary/todo.svg" alt="To Do Icon">
                            <img class="img-hover" src="app-icons/summary/todo-hover.svg" alt="To Do Icon">
                            <div>
                                <h4>1</h4>
                                <p>To-do</p>
                            </div>
                        </article>
                        <article class="card-wrapper">
                            <img class="img-normal" src="app-icons/summary/done.svg" alt="Done Icon">
                            <img class="img-hover" src="app-icons/summary/done-hover.svg" alt="Done Icon">
                            <div>
                                <h4>2</h4>
                                <p>Done</p>
                            </div>
                        </article>
                    </div>
                    <article class="card-urgent">
                        <img src="app-icons/summary/urgent.svg" alt="Urgent Icon">
                        <div>
                            <h4>1</h4>
                            <p>Urgent</p>
                        </div>
                        <div class="grey-line"></div>
                        <div>
                            <span>Date</span>
                            <p>Upcoming Deadline</p>
                        </div>
                    </article>
                    <div class="part-2">
                        <article class="card-single">
                            <h4>5</h4>
                            <p>Tasks in Board</p>
                        </article>
                        <article class="card-single">
                            <h4>2</h4>
                            <p>Tasks in Progress</p>
                        </article>
                        <article class="card-single">
                            <h4>3</h4>
                            <p>Awaiting Feedback</p>
                        </article>
                    </div>
                </section>
                <section class="summary-greeting">
                    <p>{{ greeting() }},</p>
                    <h3>{{ userName() }}</h3>
                </section>
            </section>
        </main>
    </div>
</div>
