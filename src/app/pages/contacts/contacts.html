<div class="app-layout">
	<app-navbar></app-navbar>
	<div class="page-content">
		<app-header></app-header>
		<main>
			<app-contact-list [class.hide-on-mobile]="hasSelectedContact()"></app-contact-list>
			<div class="details-wrapper" [class.show-on-mobile]="hasSelectedContact()">
				<div class="heading__wrapper">
					<div class="heading__text-wrapper">
						<h1 class="main-h1">Contacts</h1>
						<button (click)="routeToContacts()" class="contacts__return-button" type="button"><img
								src="icons/contacts/arrow-left.svg"></button>
					</div>
					<div class="heading__line"></div>
					<h2 class="main-h2">Better with a team</h2>
				</div>
				<router-outlet />
			</div>
		</main>
	</div>
</div>
